<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     THEME — edit these to match hillaigovreen.com exactly.
     For embedding inside your site, set --bg: transparent and
     --font-display / --font-body to inherit.
     ============================================================ */
  .hg-shows{
    --bg:        #FBFAF7;   /* page/section background        */
    --fg:        #1B1A17;   /* primary text (ink)             */
    --muted:     #6E6A60;   /* secondary text (dates, lineup) */
    --accent:    #9A7B3F;   /* brass — a nod to the keys of a sax/clarinet */
    --accent-2:  #7C6230;   /* darker brass for hover         */
    --rule:      #E4E0D6;   /* hairline dividers              */
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body:    "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --maxw: 720px;
  }

  .hg-shows{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 0 clamp(16px, 5vw, 32px) clamp(24px, 5vw, 64px);
  }
  .hg-shows * { box-sizing: border-box; }
  .hg-wrap{ max-width: var(--maxw); margin: 0 auto; padding-top: clamp(80px, 12vw, 110px); }

  /* Navigation — mirrors hillaigovreen.com */
  .hg-nav{
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .hg-nav-inner{
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 2rem; max-width: var(--maxw); margin-inline: auto;
  }
  .hg-brand{
    font-family: var(--font-display); font-size: 1.3rem; font-weight: 400;
    letter-spacing: 0.04em; color: var(--fg); text-decoration: none;
  }
  .hg-menu{ list-style: none; display: flex; gap: 1.8rem; padding: 0; margin: 0; }
  .hg-menu a{
    font-family: var(--font-body); font-size: .75rem; font-weight: 400;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    text-decoration: none; transition: color .15s ease;
  }
  .hg-menu a:hover{ color: var(--fg); }
  .hg-menu a[aria-current="page"]{ color: var(--fg); }
  .hg-menu a:focus-visible, .hg-brand:focus-visible, .hg-burger:focus-visible{
    outline: 2px solid var(--fg); outline-offset: 3px;
  }
  .hg-burger{
    display: none; background: none; border: 0; cursor: pointer;
    padding: .45rem; flex-direction: column; gap: 5px; margin-left: auto;
  }
  .hg-burger span{
    display: block; width: 24px; height: 2px; background: var(--fg);
    border-radius: 2px; transition: transform .3s ease, opacity .3s ease;
  }
  .hg-burger.is-open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .hg-burger.is-open span:nth-child(2){ opacity: 0; }
  .hg-burger.is-open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

  @media (max-width: 760px){
    .hg-nav-inner{ flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 1rem; padding: .9rem 1.2rem; }
    .hg-brand{ font-size: 1.15rem; }
    .hg-burger{ display: flex; }
    .hg-menu{
      position: absolute; top: 100%; left: 0; right: 0;
      flex-direction: column; gap: 0; align-items: stretch;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--rule);
      max-height: 0; overflow: hidden; transition: max-height .3s ease;
    }
    .hg-menu.is-open{ max-height: 70vh; }
    .hg-menu a{
      display: block; padding: .9rem 1.5rem; font-size: .8rem; letter-spacing: .12em;
      border-bottom: 1px solid var(--rule);
    }
    .hg-menu a:last-child{ border-bottom: none; }
  }

  .hg-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom: 28px;
  }
  .hg-title{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
  }

  /* Upcoming / Past toggle */
  .hg-toggle{ display:inline-flex; gap:2px; }
  .hg-toggle button{
    font-family: var(--font-body);
    font-size: .82rem; letter-spacing:.06em; text-transform:uppercase;
    color: var(--muted); background:none; border:none; cursor:pointer;
    padding: 8px 4px; position:relative;
  }
  .hg-toggle button + button{ margin-left:18px; }
  .hg-toggle button[aria-pressed="true"]{ color: var(--fg); }
  .hg-toggle button[aria-pressed="true"]::after{
    content:""; position:absolute; left:0; right:0; bottom:0;
    height:2px; background: var(--accent);
  }
  .hg-toggle button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* Event list */
  .hg-list{ list-style:none; margin:0; padding:0; }
  .hg-event{
    display:grid;
    grid-template-columns: 64px 1fr;
    gap: 20px;
    padding: 22px 0;
    border-top: 1px solid var(--rule);
  }
  .hg-event:last-child{ border-bottom: 1px solid var(--rule); }

  /* Past shows: crossed out + dimmed (lifts on hover for readability) */
  .hg-event.is-past{ opacity:.55; transition: opacity .15s ease; }
  .hg-event.is-past:hover{ opacity:.9; }
  .hg-event.is-past .hg-name,
  .hg-event.is-past .hg-when{
    text-decoration: line-through;
    text-decoration-color: var(--muted);
    text-decoration-thickness: 1px;
  }

  .hg-date{ text-align:center; padding-top:4px; }
  .hg-month{
    font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color: var(--accent); font-weight:600;
  }
  .hg-day{
    font-family: var(--font-display);
    font-size: 2.1rem; line-height:1; font-weight:500; margin-top:2px;
  }
  .hg-range{ font-size:.72rem; color:var(--muted); margin-top:4px; }

  .hg-body{ min-width:0; }
  .hg-name{
    font-family: var(--font-display);
    font-size: 1.3rem; font-weight:500; line-height:1.25; margin:0 0 6px;
  }
  .hg-when{ color:var(--muted); font-size:.9rem; }
  .hg-where{ font-size:.92rem; margin-top:2px; }
  .hg-where a{ color: inherit; text-decoration: none; border-bottom:1px solid var(--rule); }
  .hg-where a:hover{ border-color: var(--accent); }
  .hg-desc{
    color:var(--muted); font-size:.88rem; margin-top:10px; white-space:pre-line;
  }
  .hg-desc a{ color:var(--accent); }

  .hg-actions{ margin-top:14px; display:flex; flex-wrap:wrap; gap:18px; }
  .hg-actions a, .hg-actions button{
    font-family: var(--font-body);
    font-size:.82rem; letter-spacing:.02em;
    color: var(--accent); text-decoration:none;
    background:none; border:none; padding:0; cursor:pointer;
    transition: color .15s ease;
  }
  .hg-actions a:hover, .hg-actions button:hover{ color: var(--accent-2); }
  .hg-actions .lead{ font-weight:500; }
  .hg-actions .lead::after{ content:" →"; }
  .hg-actions a:focus-visible, .hg-actions button:focus-visible,
  .hg-where a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* States */
  .hg-state{ padding: 40px 0; color: var(--muted); font-size:.95rem; }
  .hg-state a{ color: var(--accent); }
  .hg-note{
    font-size:.8rem; color:var(--muted); background:rgba(154,123,63,.08);
    border:1px solid var(--rule); border-radius:6px;
    padding:10px 14px; margin-bottom:20px;
  }
  .hg-section-label{
    font-family: var(--font-body);
    font-size: .78rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    margin: 44px 0 4px;
  }
  .hg-foot{ margin-top:32px; color:var(--muted); font-size:.9rem; }
  .hg-foot a{ color: var(--accent); }

  @media (max-width:520px){
    .hg-event{ grid-template-columns: 52px 1fr; gap:16px; }
    .hg-day{ font-size:1.8rem; }
  }
  @media (prefers-reduced-motion: reduce){
    .hg-shows *{ transition: none !important; }
  }
</style>

<div class="hg-shows">
  <header class="hg-nav">
    <div class="hg-nav-inner">
      <a class="hg-brand" href="https://www.hillaigovreen.com/">Hillai Govreen</a>
      <button class="hg-burger" id="hg-burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="hg-menu">

      <nav class="hg-menu" id="hg-menu" aria-label="Primary">

<script>
(function () {
  // ============================================================
  // CONFIG
  // ============================================================
  var CONFIG = {
    apiKey: "AIzaSyBsarOpzxxi8CJmRXjLZc56sX0tB7jgO9U",
    calendarId: "300a0735963948487907a94a78baf42794fd9a7415ba75019b436ddcc5ab9ff2@group.calendar.google.com",
    maxResults: 50,
    pastWindowMonths: 24 // how far back "Past" looks
  };

  var content = document.getElementById("hg-content");

  // ---- helpers ------------------------------------------------
  function apiUrl(opts) {
    var p = new URLSearchParams({
      key: CONFIG.apiKey,
      singleEvents: "true",
      orderBy: "startTime",
      maxResults: String(CONFIG.maxResults)
    });
    if (opts.timeMin) p.set("timeMin", opts.timeMin);
    if (opts.timeMax) p.set("timeMax", opts.timeMax);
    return "https://www.googleapis.com/calendar/v3/calendars/" +
      encodeURIComponent(CONFIG.calendarId) + "/events?" + p.toString();
  }

  function parsePoint(p) {
    // p is start or end object from the API
    if (p.dateTime) return { d: new Date(p.dateTime), allDay: false, tz: p.timeZone };
    // all-day: anchor at noon UTC so the calendar date never drifts
    return { d: new Date(p.date + "T12:00:00Z"), allDay: true, tz: "UTC" };
  }

  function fmt(date, tz, options) {
    options = Object.assign({ timeZone: tz || undefined }, options);
    return new Intl.DateTimeFormat("en-US", options).format(date);
  }

  function sameDay(a, b, tz) {
    return fmt(a, tz, { year: "numeric", month: "2-digit", day: "2-digit" }) ===
           fmt(b, tz, { year: "numeric", month: "2-digit", day: "2-digit" });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function linkify(text) {
    // escape first, then turn bare URLs into links and keep line breaks
    return esc(text).replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      return '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>";
    });
  }

  // Google "add to calendar" link
  function gcalAddUrl(ev) {
    function z(p) {
      if (p.dateTime) return new Date(p.dateTime).toISOString().replace(/[-:]|\.\d{3}/g, "");
      return p.date.replace(/-/g, "");
    }
    var dates = z(ev.start) + "/" + z(ev.end || ev.start);
    var p = new URLSearchParams({
      action: "TEMPLATE",
      text: ev.summary || "Show",
      dates: dates,
      details: ev.description || "",
      location: ev.location || ""
    });
    return "https://calendar.google.com/calendar/render?" + p.toString();
  }

  // ICS download
  function downloadICS(ev) {
    function z(p) {
      if (p.dateTime) return "DTSTART:" + new Date(p.dateTime).toISOString().replace(/[-:]|\.\d{3}/g, "");
      return "DTSTART;VALUE=DATE:" + p.date.replace(/-/g, "");
    }
    function ze(p, key) {
      if (p.dateTime) return key + ":" + new Date(p.dateTime).toISOString().replace(/[-:]|\.\d{3}/g, "");
      return key + ";VALUE=DATE:" + p.date.replace(/-/g, "");
    }
    var ics = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//hillaigovreen//shows//EN",
      "BEGIN:VEVENT",
      "UID:" + (ev.id || Date.now()) + "@hillaigovreen.com",
      z(ev.start),
      ze(ev.end || ev.start, "DTEND"),
      "SUMMARY:" + (ev.summary || "Show"),
      ev.location ? "LOCATION:" + ev.location.replace(/\n/g, " ") : "",
      ev.description ? "DESCRIPTION:" + ev.description.replace(/\n/g, "\\n") : "",
      "END:VEVENT", "END:VCALENDAR"
    ].filter(Boolean).join("\r\n");

    var blob = new Blob([ics], { type: "text/calendar" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (ev.summary || "show").replace(/[^\w]+/g, "-").toLowerCase() + ".ics";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  }

  // ---- rendering ----------------------------------------------
  function renderEvent(ev, mode) {
    var s = parsePoint(ev.start);
    var e = parsePoint(ev.end || ev.start);

    var li = document.createElement("li");
    li.className = "hg-event" + (mode === "past" ? " is-past" : "");

    // date block
    var multiDay = !sameDay(s.d, e.d, s.tz) && !(s.allDay && fmt(new Date(e.d.getTime() - 86400000), s.tz, {day:"numeric"}) === fmt(s.d, s.tz, {day:"numeric"}));
    var rangeHtml = "";
    if (multiDay) {
      // all-day end dates are exclusive, so step back a day for display
      var endShow = s.allDay ? new Date(e.d.getTime() - 86400000) : e.d;
      rangeHtml = '<div class="hg-range">to ' + fmt(endShow, s.tz, { month: "short", day: "numeric" }) + "</div>";
    }
    var dateCol =
      '<div class="hg-date">' +
        '<div class="hg-month">' + fmt(s.d, s.tz, { month: "short" }) + "</div>" +
        '<div class="hg-day">' + fmt(s.d, s.tz, { day: "numeric" }) + "</div>" +
        rangeHtml +
      "</div>";

    // when line
    var dateLine = fmt(s.d, s.tz, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    var timeLine = "";
    if (!s.allDay) {
      var t1 = fmt(s.d, s.tz, { hour: "numeric", minute: "2-digit" });
      var t2 = e.dateTime || ev.end ? fmt(e.d, e.tz || s.tz, { hour: "numeric", minute: "2-digit" }) : "";
      var tzName = fmt(s.d, s.tz, { hour: "numeric", timeZoneName: "short" }).split(" ").pop();
      timeLine = " · " + t1 + (t2 ? " – " + t2 : "") + " " + tzName;
    }

    // location
    var whereHtml = "";
    if (ev.location) {
      whereHtml = '<div class="hg-where"><a href="https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(ev.location) + '" target="_blank" rel="noopener">' +
        esc(ev.location) + "</a></div>";
    }

    // description / lineup
    var descHtml = ev.description ? '<div class="hg-desc">' + linkify(ev.description) + "</div>" : "";

    // actions
    var actions = document.createElement("div");
    actions.className = "hg-actions";

    if (ev.htmlLink) {
      var view = document.createElement("a");
      view.className = "lead";
      view.href = ev.htmlLink; view.target = "_blank"; view.rel = "noopener";
      view.textContent = "View event";
      actions.appendChild(view);
    }
    var add = document.createElement("a");
    add.href = gcalAddUrl(ev); add.target = "_blank"; add.rel = "noopener";
    add.textContent = "Google Calendar";
    actions.appendChild(add);

    var ics = document.createElement("button");
    ics.type = "button"; ics.textContent = "ICS";
    ics.addEventListener("click", function () { downloadICS(ev); });
    actions.appendChild(ics);

    var body = document.createElement("div");
    body.className = "hg-body";
    body.innerHTML =
      '<h2 class="hg-name">' + esc(ev.summary || "Untitled show") + "</h2>" +
      '<div class="hg-when">' + dateLine + timeLine + "</div>" +
      whereHtml + descHtml;
    body.appendChild(actions);

    li.innerHTML = dateCol;
    li.appendChild(body);
    return li;
  }

  function addEvents(events, mode) {
    var ul = document.createElement("ul");
    ul.className = "hg-list";
    events.forEach(function (ev) { ul.appendChild(renderEvent(ev, mode)); });
    content.appendChild(ul);
  }

  function render(upcoming, past, note) {
    content.innerHTML = "";
    if (note) {
      var n = document.createElement("p");
      n.className = "hg-note";
      n.textContent = note;
      content.appendChild(n);
    }

    if (!upcoming.length && !past.length) {
      var p = document.createElement("p");
      p.className = "hg-state";
      p.innerHTML = 'No shows to show right now — check back soon, or <a href="https://www.hillaigovreen.com/contact">get in touch</a> about booking.';
      content.appendChild(p);
      return;
    }

    if (upcoming.length) {
      addEvents(upcoming, "upcoming");
    } else {
      var pu = document.createElement("p");
      pu.className = "hg-state";
      pu.innerHTML = 'No upcoming shows right now — check back soon, or <a href="https://www.hillaigovreen.com/contact">get in touch</a> about booking.';
      content.appendChild(pu);
    }

    if (past.length) {
      var label = document.createElement("h2");
      label.className = "hg-section-label";
      label.textContent = "Past shows";
      content.appendChild(label);
      addEvents(past, "past");
    }
  }

  // ---- data ---------------------------------------------------
  function okJson(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }

  function load() {
    content.innerHTML = '<p class="hg-state">Loading dates…</p>';
    var now = new Date();
    var upcomingUrl = apiUrl({ timeMin: now.toISOString() });
    var pastUrl = apiUrl({
      timeMax: now.toISOString(),
      timeMin: new Date(now.getFullYear(), now.getMonth() - CONFIG.pastWindowMonths, 1).toISOString()
    });

    Promise.all([fetch(upcomingUrl).then(okJson), fetch(pastUrl).then(okJson)])
      .then(function (res) {
        var upcoming = res[0].items || [];
        var past = (res[1].items || []).reverse(); // most recent first
        render(upcoming, past, null);
      })
      .catch(function (err) {
        // Likely a referrer block (e.g. previewing off-domain) — show sample data
        // so the layout is visible. On hillaigovreen.com this path won't run.
        var note = "Showing sample dates — your live calendar loads when this page is on hillaigovreen.com.";
        render(demoEvents("upcoming"), demoEvents("past"), note);
        console.warn("Calendar fetch failed, using sample data:", err.message);
      });
  }

  // sample data for preview only (dynamic dates so they always look current)
  function demoEvents(mode) {
    var base = new Date();
    function mk(offsetDays, hour, len, summary, location, desc) {
      var s = new Date(base); s.setDate(s.getDate() + offsetDays); s.setHours(hour, 0, 0, 0);
      var e = new Date(s); e.setHours(hour + len);
      return {
        id: "demo" + offsetDays,
        summary: summary, location: location, description: desc,
        start: { dateTime: s.toISOString() }, end: { dateTime: e.toISOString() },
        htmlLink: "https://calendar.google.com/"
      };
    }
    if (mode === "past") {
      return [
        mk(-12, 20, 2, "Hillai Govreen Quartet", "Ornithology Jazz Club, Brooklyn, NY",
          "Hillai Govreen — Clarinet & Saxophone\nSteve Cardenas — Guitar\nBen Meigners — Bass\nEric McPherson — Drums"),
        mk(-40, 21, 2, "Allusions — Hillai & Nitsan", "Beit Haamudim, Tel Aviv",
          "Duo set: clarinet & piano. Music from the album Allusions.")
      ];
    }
    return [
      mk(9, 19, 2, "Every Other Now — Album Release", "Smalls Jazz Club, New York, NY",
        "Hillai Govreen — Woodwinds\nBen Meigners — Bass\nSteve Cardenas — Guitar\nTickets at the door."),
      mk(23, 20, 2, "Hillai Govreen Quintet", "Shapeshifter Lab, Brooklyn, NY",
        "An evening of original compositions.")
    ];
  }

  // init
  load();
})();
</script>

<script>
// Mobile nav toggle
(function () {
  var b = document.getElementById("hg-burger");
  var m = document.getElementById("hg-menu");
  if (!b || !m) return;
  b.addEventListener("click", function () {
    var open = m.classList.toggle("is-open");
    b.classList.toggle("is-open", open);
    b.setAttribute("aria-expanded", String(open));
  });
  m.addEventListener("click", function (e) {
    if (e.target.tagName === "A") {
      m.classList.remove("is-open");
      b.classList.remove("is-open");
      b.setAttribute("aria-expanded", "false");
    }
  });
})();
</script>
